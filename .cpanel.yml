---
# cPanel Git Version Control deployment (cPanel > Git Version Control > Manage > Pull or Deploy).
# The app runs straight from the cloned repository folder, so "Update from Remote" brings in the
# new code and "Deploy HEAD Commit" runs the tasks below inside that folder.
#
# Before the first deploy, create .env in the repository folder (copy .env.example and fill in
# APP_KEY, APP_URL, DB_* and MAIL_*). The frontend is committed prebuilt in public/build, so run
# `npm run build` locally and commit the result whenever the CSS or JS changes.
#
# Composer is downloaded once to ~/composer.phar, so it works whether or not the host provides it.
# If your host keeps PHP 8.4 elsewhere, change PHP_BIN.
deployment:
  tasks:
    - export PHP_BIN=/opt/cpanel/ea-php84/root/usr/bin/php
    - export COMPOSER_BIN=$HOME/composer.phar
    - export COMPOSER_HOME=$HOME/.composer
    - if [ ! -s $COMPOSER_BIN ]; then curl -sSL https://getcomposer.org/download/latest-stable/composer.phar -o $COMPOSER_BIN; fi
    - $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    - if [ -f .env ]; then $PHP_BIN artisan migrate --force; fi
    - if [ -f .env ] && [ ! -e public/storage ]; then $PHP_BIN artisan storage:link; fi
    - if [ -f .env ]; then $PHP_BIN artisan optimize; fi
